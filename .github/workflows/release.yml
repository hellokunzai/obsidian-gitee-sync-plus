name: Release Obsidian Plugin

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Prepare release notes
        id: notes
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          notes_file="release-notes.md"
          # 发布正文内联维护，避免依赖仓库外的文件
          cat > "$notes_file" <<'NOTES'
          ## Gitee Sync Plus 1.3.4

          ### ✨ 新增 / Added
          - **GitLab 平台支持**：新增 GitLab 后端，可同步到官方或自建 GitLab 仓库。
          - **Gitea 平台支持**：新增 Gitea 后端，支持私有 Gitea 实例同步。
          - 现已同时支持 **Gitee / GitHub / GitLab / Gitea** 四大平台，且无需本地安装 git。

          ### 🔧 重构 / Changed
          - 后端模块化：各平台拆为独立 backend 模块，新增令牌管理器与 git-hash 工具，统一同步引擎。
          - 重写设置面板、冲突解决器、差异视图与 Git 面板，交互更清晰稳定。
          - README 中英双语重构（README.md 中文 / README.en.md 英文）。

          ### 🛠 修复 / Fixed
          - 版本号对齐：package.json 升到 1.3.4，与 manifest / versions 一致。
          - 安全：移除 innerHTML 直接赋值，改用 Obsidian 的 .empty() 清空下拉，消除 XSS 风险。
          - 样式：9 个自绘按钮提升 CSS 特异性并补充 height: auto，避免被默认样式覆盖。
          NOTES
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create or update Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.notes.outputs.tag }}"
          notes_file="release-notes.md"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists -> re-upload assets and update notes"
            gh release upload "$tag" main.js manifest.json styles.css --clobber
            gh release edit "$tag" --notes-file "$notes_file"
          else
            echo "Creating new release $tag"
            gh release create "$tag" \
              --title "$tag" \
              --notes-file "$notes_file" \
              main.js manifest.json styles.css
          fi
