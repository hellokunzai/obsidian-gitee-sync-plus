<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DiffView 冲突解决交互原型（最终版）</title>
  <style>
    :root {
      --bg: #f8f9fa;
      --panel-bg: #ffffff;
      --text: #2e3338;
      --text-muted: #8a8f96;
      --border: #dfe1e4;
      --accent: #7b6cd9;
      --accent-hover: #6a5bc7;
      --danger-bg: rgba(255, 107, 107, 0.12);
      --danger-border: rgba(255, 107, 107, 0.35);
      --warn-bg: rgba(255, 193, 99, 0.14);
      --warn-border: rgba(255, 193, 99, 0.4);
      --added-bg: rgba(99, 201, 122, 0.12);
      --added-border: rgba(99, 201, 122, 0.4);
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      --radius: 10px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 40px 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .prototype-note {
      max-width: 920px;
      margin: 0 auto 20px;
      padding: 12px 16px;
      background: #fff;
      border-left: 4px solid var(--accent);
      border-radius: 6px;
      box-shadow: var(--shadow);
      font-size: 13px;
      color: var(--text-muted);
    }

    .prototype-note strong { color: var(--text); }

    .modal {
      max-width: 960px;
      margin: 0 auto;
      background: var(--panel-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 720px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      background: #f4f5f7;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      padding: 5px 12px;
      font-size: 13px;
      color: var(--text-muted);
      background: #e8eaed;
      border: 1px solid var(--border);
      border-radius: 5px;
      cursor: pointer;
    }

    .title { font-size: 15px; font-weight: 600; }

    .header-right { display: flex; gap: 8px; }

    .icon-btn {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .diff-columns {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
    }

    .column {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .column:first-child { border-right: 1px solid var(--border); }

    .column-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #f9fafb;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .column-label { display: flex; align-items: center; gap: 8px; }

    .badge {
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
    }

    .badge-local { background: #e8eaf6; color: #5c6bc0; }
    .badge-remote { background: #fff3e0; color: #ff9800; }

    .line-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .diff-row {
      display: flex;
      align-items: stretch;
      min-height: 32px;
      transition: background 0.25s ease, opacity 0.25s ease;
    }

    .diff-row.is-unchanged { color: var(--text); }
    .diff-row.is-removed  { background: var(--danger-bg); }
    .diff-row.is-added    { background: var(--warn-bg); }
    .diff-row.is-modified { background: var(--warn-bg); }

    /* 已解决：清除差异背景色 */
    .diff-row.resolved {
      background: transparent !important;
      color: var(--text);
    }

    .diff-row.resolved .line-content { opacity: 0.55; }
    .diff-row.resolved .line-number { opacity: 0.55; }

    /* 行号区：行号（左） + 勾选按钮（右） */
    .line-marker {
      width: 64px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      padding: 5px 8px;
      border-right: 1px solid var(--border);
      user-select: none;
    }

    .line-number {
      font-size: 12px;
      color: var(--text-muted);
      text-align: right;
      min-width: 22px;
    }

    .pick-btn {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      margin-left: 6px;
      cursor: pointer;
      accent-color: var(--accent);
      transition: transform 0.15s ease;
    }

    .pick-btn:hover {
      transform: scale(1.1);
    }

    /* 远端列复选框强调色 */
    .column-remote .pick-btn {
      accent-color: #ff9800;
    }

    .line-body {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 5px 10px;
      min-width: 0;
    }

    .line-content {
      flex: 1;
      font-family: "SF Mono", Monaco, "Cascadia Code", Consolas, monospace;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .empty-content { color: var(--text-muted); font-style: italic; }

    /* 远端内容被采纳到本地行时的高亮提示 */
    .flash-local { animation: flashLocal 0.6s ease; }

    @keyframes flashLocal {
      0% { background: rgba(123, 108, 217, 0.22); }
      100% { background: transparent; }
    }

    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      border-top: 1px solid var(--border);
      background: #f4f5f7;
    }

    .status-text {
      font-size: 13px;
      color: var(--text-muted);
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 6px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }

    .btn-secondary {
      background: #fff;
      color: var(--text);
    }

    .btn-secondary:hover:not(:disabled) { background: #f0f1f3; }

    .btn-success {
      background: #4caf50;
      border-color: #4caf50;
      color: #fff;
    }

    .btn-success:hover:not(:disabled) { background: #43a047; }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      padding: 10px 20px;
      background: #2e3338;
      color: #fff;
      border-radius: 6px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .legend {
      max-width: 960px;
      margin: 16px auto 0;
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--text-muted);
    }

    .legend-item { display: flex; align-items: center; gap: 6px; }
    .dot { width: 10px; height: 10px; border-radius: 2px; }
    .dot-removed { background: var(--danger-bg); border: 1px solid var(--danger-border); }
    .dot-added { background: var(--warn-bg); border: 1px solid var(--warn-border); }
    .dot-resolved { background: var(--added-bg); border: 1px solid var(--added-border); }
  </style>
</head>
<body>
  <div class="prototype-note">
    <strong>交互原型说明（最终版）：</strong>
    <br>· <strong>布局</strong>：每列内「行号在左、勾选按钮在右」，勾选后按钮不消失，仅切换选中态。
    <br>· <strong>单行选择</strong>：点击某行本地/远端按钮选中该侧；两行互斥，再次点击已选中按钮可取消。
    <br>· <strong>批量选择</strong>：底部「保留本地 / 使用远端」可一次性把所有差异行设为对应侧。
    <br>· <strong>应用合并</strong>：仅当所有差异行都已选择时才可点击；点击后执行最终合并并给出提示。
    <br>· 确认此交互后再进入插件代码开发。
  </div>

  <div class="modal">
    <div class="modal-header">
      <div class="header-left">
        <button class="back-btn">← 返回</button>
        <span class="title">文件差异 — 未命名.md</span>
      </div>
      <div class="header-right">
        <button class="icon-btn" title="上一处差异">↑</button>
        <button class="icon-btn" title="下一处差异">↓</button>
        <button class="icon-btn" title="关闭">×</button>
      </div>
    </div>

    <div class="diff-columns">
      <div class="column column-local" id="localColumn">
        <div class="column-header">
          <span class="column-label">
            本地版本
            <span class="badge badge-local">当前</span>
          </span>
        </div>
        <div class="line-list" id="localList"></div>
      </div>

      <div class="column column-remote" id="remoteColumn">
        <div class="column-header">
          <span class="column-label">
            远端版本
            <span class="badge badge-remote">远程</span>
          </span>
        </div>
        <div class="line-list" id="remoteList"></div>
      </div>
    </div>

    <div class="modal-footer">
      <span class="status-text" id="statusText">差异行：4 行待处理</span>
      <div class="actions">
        <button class="btn btn-secondary" id="keepLocalBtn">保留本地</button>
        <button class="btn btn-secondary" id="useRemoteBtn">使用远端</button>
        <button class="btn btn-success" id="applyMergeBtn" disabled>应用合并</button>
      </div>
    </div>
  </div>

  <div class="legend">
    <div class="legend-item"><span class="dot dot-removed"></span>删除/冲突</div>
    <div class="legend-item"><span class="dot dot-added"></span>新增/修改</div>
    <div class="legend-item"><span class="dot dot-resolved"></span>已解决（已写入本地列）</div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // 模拟差异数据：每一对 local/remote 行组成一个 "hunk"
    const diffData = [
      { type: "same", local: "<<<<<<< HEAD", remote: "<<<<<<< HEAD" },
      { type: "same", local: "作者：陈允皓", remote: "作者：陈允皓" },
      { type: "same", local: "...", remote: "..." },
      { type: "same", local: "", remote: "" },
      {
        type: "modified",
        local: "# 6年1000小时1张图，我对Obsidian的全部理解（可下载）",
        remote: "# 6年1000小时1张图，我对Obsidian的全部理解（可下载）"
      },
      {
        type: "removed",
        local: "阿三大苏打实打实的",
        remote: ""
      },
      {
        type: "removed",
        local: "https://zhuanlan.zhihu.com/p/1995967882560058228",
        remote: "https://zhuanlan.zhihu.com/p/1995967882560058228"
      },
      {
        type: "same",
        local: "",
        remote: ""
      },
      {
        type: "modified",
        local: "123123123123",
        remote: "123123123123"
      },
      {
        type: "removed",
        local: "123123123123123",
        remote: "123123123123123"
      }
    ];

    const localList = document.getElementById("localList");
    const remoteList = document.getElementById("remoteList");
    const keepLocalBtn = document.getElementById("keepLocalBtn");
    const useRemoteBtn = document.getElementById("useRemoteBtn");
    const applyMergeBtn = document.getElementById("applyMergeBtn");
    const statusText = document.getElementById("statusText");
    const toast = document.getElementById("toast");

    // 每行的解决状态：null = 未选择, 'local' = 选本地, 'remote' = 选远端
    const choices = diffData.map(() => null);
    let merged = false;

    function renderRow(index, side, item) {
      const row = document.createElement("div");
      row.className = `diff-row ${item.type}`;
      row.dataset.index = index;

      const marker = document.createElement("div");
      marker.className = "line-marker";

      const lineNo = document.createElement("span");
      lineNo.className = "line-number";
      lineNo.textContent = index + 1;
      marker.appendChild(lineNo);

      // 仅差异行显示复选框
      if (item.type !== "same") {
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "pick-btn";
        checkbox.dataset.index = index;
        checkbox.dataset.side = side;
        checkbox.title = side === "local" ? "采用本地版本" : "采用远端版本";
        checkbox.addEventListener("change", (e) => setRowChoice(index, side, e.target.checked));
        marker.appendChild(checkbox);
      }

      const body = document.createElement("div");
      body.className = "line-body";

      const content = document.createElement("div");
      content.className = "line-content";
      if (item[side] === "") {
        content.classList.add("empty-content");
        content.textContent = side === "local" && item.type === "removed" ? "（将被删除）" : "";
      } else {
        content.textContent = item[side];
      }

      body.appendChild(content);
      row.appendChild(marker);
      row.appendChild(body);

      return row;
    }

    function render() {
      localList.innerHTML = "";
      remoteList.innerHTML = "";
      diffData.forEach((item, index) => {
        localList.appendChild(renderRow(index, "local", item));
        remoteList.appendChild(renderRow(index, "remote", item));
      });
      syncUI();
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function updateButtons() {
      const boxes = document.querySelectorAll(".pick-btn");
      boxes.forEach(box => {
        const idx = Number(box.dataset.index);
        const side = box.dataset.side;
        box.checked = choices[idx] === side;
      });
    }

    function updateRows() {
      diffData.forEach((item, index) => {
        const localRow = localList.children[index];
        const remoteRow = remoteList.children[index];
        const choice = choices[index];
        const resolved = choice !== null;

        [localRow, remoteRow].forEach(r => {
          r.classList.toggle("resolved", resolved);
        });

        // 本地列始终显示最终采纳的内容
        const localContent = localRow.querySelector(".line-content");
        if (resolved) {
          const chosenText = item[choice];
          localContent.textContent = chosenText === "" ? "（已删除该行）" : chosenText;
          localContent.classList.toggle("empty-content", chosenText === "");
        } else {
          localContent.textContent = item.local === "" ? "（将被删除）" : item.local;
          localContent.classList.toggle("empty-content", item.local === "");
        }
      });
    }

    function updateStatus() {
      const total = diffData.filter(d => d.type !== "same").length;
      const done = choices.filter(c => c !== null).length;

      if (merged) {
        statusText.textContent = "合并已完成";
        return;
      }

      if (done === 0) {
        statusText.textContent = `差异行：${total} 行待处理`;
      } else if (done === total) {
        statusText.textContent = `全部差异行已处理，可点击「应用合并」`;
      } else {
        statusText.textContent = `已处理 ${done}/${total} 行差异`;
      }

      // 应用合并按钮：全部解决前禁用
      applyMergeBtn.disabled = done !== total || total === 0;
    }

    function syncUI() {
      updateButtons();
      updateRows();
      updateStatus();
    }

    // 单行选择/取消选择
    function setRowChoice(index, side, checked) {
      if (merged) return;
      if (diffData[index].type === "same") return;

      if (checked) {
        choices[index] = side;
      } else if (choices[index] === side) {
        choices[index] = null;
      }

      syncUI();

      if (choices[index] === null) {
        showToast(`第 ${index + 1} 行已取消选择`);
      } else {
        const label = choices[index] === "local" ? "本地" : "远端";
        showToast(`第 ${index + 1} 行已采用${label}版本`);
      }
    }

    // 批量选择：把所有差异行设为 side
    function applyAll(side) {
      if (merged) return;
      diffData.forEach((item, index) => {
        if (item.type !== "same") {
          choices[index] = side;
        }
      });
      syncUI();
      const label = side === "local" ? "保留本地" : "使用远端";
      showToast(`已全部应用「${label}」方案`);
    }

    // 应用合并：检查全部已解决后执行最终合并
    function applyMerge() {
      if (merged) return;
      const total = diffData.filter(d => d.type !== "same").length;
      const done = choices.filter(c => c !== null).length;
      if (done !== total) {
        showToast("仍有未解决的差异行，无法合并");
        return;
      }

      merged = true;
      keepLocalBtn.disabled = true;
      useRemoteBtn.disabled = true;
      applyMergeBtn.disabled = true;
      applyMergeBtn.textContent = "已合并";

      // 禁用所有行内按钮
      document.querySelectorAll(".pick-btn").forEach(btn => (btn.disabled = true));

      updateStatus();
      showToast("文件合并完成");

      // 控制台打印最终内容（模拟写入文件）
      const finalLines = diffData.map((item, i) =>
        choices[i] !== null ? item[choices[i]] : item.local
      );
      console.log("--- 合并结果 ---\n" + finalLines.join("\n"));
    }

    keepLocalBtn.addEventListener("click", () => applyAll("local"));
    useRemoteBtn.addEventListener("click", () => applyAll("remote"));
    applyMergeBtn.addEventListener("click", applyMerge);

    render();
  </script>
</body>
</html>
